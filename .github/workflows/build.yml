name: Build APK

# 推送到 main/master 时自动打包，也可以在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 准备 Gradle（本仓库无 gradlew，故直接安装 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK（在本次运行的 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: LingQiongBuddy-2.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
