name: Build APK

# 推送到 main/master 时自动打包，也可以在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3（它会联网现下 cmdline-tools，容易失败）
      # 直接复用 runner 预装的 SDK；找不到时再兜底下载一次
      - name: 准备 Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            for d in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then export ANDROID_HOME="$d"; break; fi
            done
          fi
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::找不到预装 Android SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $ANDROID_HOME 下没找到 sdkmanager"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 准备 Gradle（本仓库无 gradlew，故直接安装 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK（在本次运行的 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: LingQiongBuddy-2.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
