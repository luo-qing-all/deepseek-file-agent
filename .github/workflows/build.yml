name: Build Release APK

# 推送到 main/master 时自动打包正式签名包，也可在 Actions 页面手动 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 必须与 app/build.gradle 的 applicationId 完全一致，
      # 且长度必须等于官方包名 com.termux（10 字节），否则等长替换会损坏 ELF。
      APP_ID: com.lq.app
      UPSTREAM_ID: com.termux

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 准备内置 Termux 环境 ───────────────────────────────────────
      # 官方 bootstrap 的二进制里硬编码了 /data/data/com.termux；
      # 这里下载后等长替换成本 App 的包名，从而：
      #   ① 环境真正属于本 App；② 与官方 Termux 可共存。
      # 因为替换前后均为 10 字节，ELF 内部字符串偏移不变，二进制不损坏。
      - name: 准备内置 Termux 环境（与官方 Termux 共存）
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/bootstrap-aarch64.zip"
          RAW="$RUNNER_TEMP/bootstrap-raw.zip"
          BS="$RUNNER_TEMP/bs"
          mkdir -p "$(dirname "$OUT")"

          if [ "${#APP_ID}" -ne "${#UPSTREAM_ID}" ]; then
            echo "::error::APP_ID($APP_ID) 必须与 $UPSTREAM_ID 等长（${#UPSTREAM_ID} 字节），否则会损坏二进制。"
            exit 1
          fi

          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq zip unzip >/dev/null 2>&1 || true

          # 1) 选源：优先复用仓库里已放好的 bootstrap，否则联网下载
          if [ -s "$OUT" ]; then
            echo ">> 使用仓库中已有的 assets/bootstrap-aarch64.zip"
            RAW="$OUT"
          else
            echo ">> assets 里没有 bootstrap，联网下载…"
            find_url() {
              echo ">> [A] 查询 GitHub API…" >&2
              for page in 1 2 3 4 5; do
                u=$(curl -s "https://api.github.com/repos/termux/termux-packages/releases?per_page=100&page=$page" \
                    | grep -o 'https://[^"]*bootstrap-aarch64\.zip' | head -1 || true)
                if [ -n "$u" ]; then echo "$u"; return 0; fi
              done
              echo ">> [B] 查询 releases.atom…" >&2
              tag=$(curl -sL "https://github.com/termux/termux-packages/releases.atom" \
                    | grep -oE 'bootstrap-[0-9]{4}\.[0-9]{2}\.[0-9]{2}' | head -1 || true)
              if [ -n "$tag" ]; then
                echo "https://github.com/termux/termux-packages/releases/download/$tag/bootstrap-aarch64.zip"
                return 0
              fi
              echo ">> [C] 探测固定 tag…" >&2
              for t in \
                bootstrap-2025.01.01 bootstrap-2024.10.13 bootstrap-2024.05.11 \
                bootstrap-2024.01.02 bootstrap-2023.11.19 bootstrap-2023.05.05 \
                bootstrap-2023.02.20 bootstrap-2022.10.26
              do
                u="https://github.com/termux/termux-packages/releases/download/$t/bootstrap-aarch64.zip"
                if curl -fIL -s --retry 2 "$u" > /dev/null; then echo "$u"; return 0; fi
              done
              return 1
            }
            URL="$(find_url || true)"
            echo "bootstrap 来源: $URL"
            if [ -z "$URL" ]; then
              echo "::error::无法定位 Termux bootstrap 下载地址（上游可能变更）。"
              echo "::error::请手动下载 bootstrap-aarch64.zip 放到 app/src/main/assets/ 后重跑。"
              exit 1
            fi
            curl -fL --retry 3 --retry-delay 2 -o "$RAW" "$URL"
          fi
          ls -lh "$RAW"

          # 2) 解压 → 等长替换包名 → 重新打包
          rm -rf "$BS"; mkdir -p "$BS"
          unzip -q "$RAW" -d "$BS"
          cd "$BS"
          echo ">> 把 $UPSTREAM_ID 等长替换为 $APP_ID"
          find . -type f -print0 | xargs -0 perl -0777 -pi -e "s/\Q${UPSTREAM_ID}\E/${APP_ID}/g"
          rm -f "$OUT"
          zip -qr "$OUT" .
          cd "$GITHUB_WORKSPACE"
          echo "内置 Termux 环境准备完成：$(du -h "$OUT" | cut -f1)"

      # 不用 android-actions/setup-android@v3（它会联网现下 cmdline-tools，容易失败）
      # 直接复用 runner 预装的 SDK；找不到时再兜底下载一次
      - name: 准备 Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            for d in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then export ANDROID_HOME="$d"; break; fi
            done
          fi
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::找不到预装 Android SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::在 $ANDROID_HOME 下没找到 sdkmanager"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 准备 Gradle（本仓库无 gradlew，故直接安装 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # ── ★ 从 Secrets 还原签名密钥（正式包的关键）────────────
      - name: 从 Secrets 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS:   ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS:     ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::未配置 SIGNING_KEYSTORE_BASE64，release 将【不签名】（仅供测试）。"
            echo "::warning::请在仓库 Settings → Secrets and variables → Actions 添加签名密钥。"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          {
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/release.jks"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "签名密钥已还原。"

      - name: 构建 Release APK（正式签名）
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -6 || true

      - name: 上传 APK（在本次运行的 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: LingQiongBuddy-2.5.2-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
